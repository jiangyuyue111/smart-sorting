# 智能分拣机 —— 机器参数。换场地/换机构只改这个文件，代码不动。
#
# ===== 传动换算（齿轮传动）=====
#   分度圆直径  d = 模数 m × 齿数 z          （mm）
#   每转行程    L = π·d / 减速比 i           （mm/转）
#   每毫米步数  S = 整步数 × 细分 / L         （步/mm）
#
# 例：m=1.0, z=20 → d=20mm → L=62.83mm/转
#     200×16 / 62.83 = 50.93 步/mm
#
# ⚠ 齿轮参数现在还没定（硬件在做），以下是**占位值**。
#   装配完成后只改这里的 module/teeth/reduction，重跑 `--verify` 确认，
#   不要改代码。所有轴都从这张表算步数。

# ---------------------------------------------------------------- 标定状态
# 这个表不是给程序算的，是给**报告**用的：demo 会把 pending 里的项原样列成
# "待实物标定清单"。calibrated = false 时，报告里所有由这些参数算出来的
# 数字（步数、节拍、行程）都会标注为"解析估算"，不会写成实测值。
[meta]
calibrated = false
pending = [
  "四个轴的 module_mm / teeth / reduction（齿轮未装配）",
  "四个轴的 speed_mm_s（要实测最高不失步速度后填）",
  "z_pick_mm / z_drop_mm / z_safe_mm（取决于夹爪实际长度和工件高度）",
  "grip_open_mm / grip_close_mm / grip_hold_min_mm（取决于工件尺寸和爪口行程）",
  "grip_settle_s（实测夹紧稳定时间）",
  "backlash_mm（实测齿条回程间隙）",
  "tray.x0_mm / y0_mm（托盘在整机上的安装位置）",
  "bins 的 6 个坐标（料盒实际摆放）",
]

# ---------------------------------------------------------------- 四个轴
[axis.x]
kind          = "linear"     # 直线轴
module_mm     = 1.0          # 齿轮模数
teeth         = 20           # 主动轮齿数（齿条按分度圆展开）
reduction     = 1.0          # 减速比（电机:输出）
steps_per_rev = 200          # 1.8° 步进
microstep     = 16
max_mm        = 273.0
speed_mm_s    = 200.0

[axis.y]
kind          = "linear"
module_mm     = 1.0
teeth         = 20
reduction     = 1.0
steps_per_rev = 200
microstep     = 16
max_mm        = 200.0
speed_mm_s    = 200.0

[axis.z]
kind          = "linear"
module_mm     = 1.0
teeth         = 16
reduction     = 1.0
steps_per_rev = 200
microstep     = 16
max_mm        = 80.0
speed_mm_s    = 100.0

# 夹爪张合：把"开合量"也当成一根直线轴来算步数，语义统一
[axis.grip]
kind          = "grip"
module_mm     = 1.0
teeth         = 16
reduction     = 2.0          # 中间加一级减速，开合力矩更大
steps_per_rev = 200
microstep     = 16
max_mm        = 40.0         # 0 = 完全闭合, 40 = 全张开
speed_mm_s    = 60.0

# ---------------------------------------------------------------- 工艺
[process]
z_pick_mm    = 5.0           # 取件下探高度（Z 绝对值，0 = 最上）
z_drop_mm    = 5.0
z_safe_mm    = 45.0          # 安全高度，移动时必须先到这

grip_open_mm     = 35.0      # 张开
grip_close_mm    = 6.0       # 完全闭合的目标位（空夹会一直走到这里）
grip_hold_min_mm = 12.0      # 停止位 ≥ 此值 → 判定夹到工件
grip_settle_s    = 0.15      # 夹紧/松开后等待稳定

# 齿轮齿条有回程间隙，每次换向补一点
backlash_mm = 0.05

# ---------------------------------------------------------------- 时序
[timing]
ack_timeout_s  = 0.5
done_timeout_s = 15.0
heartbeat_s    = 0.2

# ---------------------------------------------------------------- 托盘
# 相机视野覆盖的托盘区域（mm，托盘坐标系，原点在托盘左下角）
[tray]
width_mm  = 160.0
height_mm = 160.0
x0_mm     = 10.0             # 托盘左下角在整机坐标系里的位置
y0_mm     = 30.0

# ---------------------------------------------------------------- 料盒
# 赛规是 6 类，所以 6 个盒子，编号 1..6。两列三行。
# 键就是类别序号，显示、分拣、任务队列共用。
[bins]
1 = [205.0,  45.0]
2 = [255.0,  45.0]
3 = [205.0, 105.0]
4 = [255.0, 105.0]
5 = [205.0, 165.0]
6 = [255.0, 165.0]
